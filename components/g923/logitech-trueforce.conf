# hid-logitech-dd (logitech-trueforce-dkms) options for the G923 Xbox edition.
# g923_xbox_dd_engine=1: the driver's own force engine (friction, inertia and
# ramp as on the G29) instead of the wheel firmware's HID++ 0x8123 effects.
# g923_pedal_invert=N: pedals stay 255 released, as the game bindings expect.
# Load-time options; also copied into the initramfs by the modconf hook.
options hid-logitech-dd g923_pedal_invert=N g923_xbox_dd_engine=1
