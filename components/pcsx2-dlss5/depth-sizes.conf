# Native depth-buffer size per game, for games that are not 640x448.
# The launcher multiplies it by PCSX2's internal resolution and sizes the game
# window to match; DLSS 5 only runs when the two are equal.
# Find a game's size in ReShade (Home) > Add-ons > Generic Depth, then divide
# by the internal resolution. Format: <ROM file glob> <width>x<height>
#
# Example:
# *Shadow of the Colossus* 512x448
