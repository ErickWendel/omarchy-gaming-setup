# Managed by omarchy-gaming-setup (components/handbrake).
# The USB handbrake reuses Logitech's RumblePad 2/F710 ID (046d:c219). The
# Logitech driver claims it, fails to set up rumble, and leaves it unbound, so
# no input device exists. HID_QUIRK_IGNORE_SPECIAL_DRIVER (BIT 22) makes the
# generic HID driver bind it instead. usbhid is built in, so this must be a
# kernel command-line option.
KERNEL_CMDLINE[default]+=" usbhid.quirks=0x046d:0xc219:0x400000"
